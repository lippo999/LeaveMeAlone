# Builds, tests and publishes LeaveMeAlone.exe (self-contained, single file — no .NET install needed).
#
#   push to main  → tests, then refreshes the rolling "nightly" pre-release with the new exe
#   push tag v*   → tests, then creates a versioned release (e.g. v0.2.0) with the exe
#   pull request  → tests + exe as a workflow artifact only
#
# Download links:
#   latest stable : https://github.com/<owner>/<repo>/releases/latest/download/LeaveMeAlone.exe
#   latest main   : https://github.com/<owner>/<repo>/releases/download/nightly/LeaveMeAlone.exe
name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # create/update releases

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  NIGHTLY_TAG: nightly

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Test
        run: dotnet test LeaveMeAlone.sln -c Release --logger "console;verbosity=normal"

      - name: Compute version
        id: version
        run: |
          [xml]$proj = Get-Content src/LeaveMeAlone/LeaveMeAlone.csproj
          $base = "$($proj.Project.PropertyGroup.Version)".Trim()
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $version = $env:GITHUB_REF_NAME.TrimStart('v')
          } else {
            $version = "$base-ci.$env:GITHUB_RUN_NUMBER"
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          Write-Host "Version: $version"

      - name: Publish single-file exe
        run: >
          dotnet publish src/LeaveMeAlone/LeaveMeAlone.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:DebugType=none
          -p:Version=${{ steps.version.outputs.version }}
          -p:SourceRevisionId=${{ github.sha }}
          -o publish

      - name: Checksum
        run: |
          $hash = (Get-FileHash publish/LeaveMeAlone.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  LeaveMeAlone.exe" | Out-File -Encoding ascii publish/LeaveMeAlone.exe.sha256
          Write-Host "SHA256: $hash"

      - uses: actions/upload-artifact@v4
        with:
          name: LeaveMeAlone-${{ steps.version.outputs.version }}
          path: publish/*
          if-no-files-found: error

      - name: Release (tag)
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$env:GITHUB_REF_NAME"
          publish/LeaveMeAlone.exe publish/LeaveMeAlone.exe.sha256
          --title "LeaveMeAlone $env:GITHUB_REF_NAME"
          --generate-notes

      - name: Release (nightly from main)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # Recreate the rolling pre-release so its tag points at this commit.
          gh release delete $env:NIGHTLY_TAG --cleanup-tag --yes 2>$null
          $global:LASTEXITCODE = 0
          gh release create $env:NIGHTLY_TAG publish/LeaveMeAlone.exe publish/LeaveMeAlone.exe.sha256 `
            --prerelease --target $env:GITHUB_SHA `
            --title "Nightly ($env:VERSION)" `
            --notes "Latest build of main ($env:GITHUB_SHA). Run LeaveMeAlone.exe (accept the administrator prompt). For a stable build use the latest non-nightly release."
